name: CI

# ─────────────────────────────────────────────────────────────────────────
#  Enjoy Milk ERP — continuous integration
#
#  WHY THIS EXISTS
#  ---------------
#  The production database was originally provisioned with
#  `prisma db push --accept-data-loss`, not by the migration chain. That
#  hid a large drift: 21 models in schema.prisma have no CREATE TABLE in
#  any migration, and two migrations reference tables the chain never
#  creates. Production works only because db push built the schema
#  directly — a fresh database cannot be built from this repo today.
#
#  Nothing detected that, because nothing ever ran the migrations against
#  an empty database. This workflow does exactly that, on every push.
#
#  STATUS
#  ------
#  Fixed by 20260516120000_catchup_missing_objects (Stage 3). Before it,
#  applying the chain to an empty PostgreSQL 16 database aborted at
#  20260723170000_drop_pallets_count line 18 with 'relation
#  ProductionProducedItem does not exist', after building 33 of 56 tables.
#
#  After it, the full chain applies cleanly and the resulting schema is
#  identical to live production on all three axes:
#      columns + types + precision/scale + nullability   56/56 tables
#      indexes                                           172
#      foreign keys                                       43
#
#  All jobs are expected to pass. A failure here means real drift has been
#  reintroduced — fix the migration, never the check.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────────────────────
  #  1. Migration chain must build a database from nothing.
  # ───────────────────────────────────────────────────────────────────
  migrations:
    name: Migration chain (fresh database)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: enjoymilk_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Scratch database. Created empty by the service above, thrown away
      # with the runner. No production credentials are used anywhere in CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/enjoymilk_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Prisma CLI
        run: npm install --no-save prisma@5.22.0 @prisma/client@5.22.0

      # ── CHECK 1 ──────────────────────────────────────────────────────
      # Every migration must apply cleanly, in order, to an empty database.
      # This is what a brand-new tenant environment or a disaster-recovery
      # restore would do.
      - name: prisma migrate deploy (fresh database)
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      # ── CHECK 2 ──────────────────────────────────────────────────────
      # After the chain has run, the resulting database must match
      # schema.prisma exactly. --exit-code makes a non-empty diff fail the
      # build: exit 0 = no drift, exit 2 = drift found.
      #
      # This is the check that catches "someone edited schema.prisma and
      # forgot to generate a migration" — the exact way the current drift
      # accumulated.
      - name: prisma migrate diff --exit-code (drift detection)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            --script > /tmp/drift.sql || DRIFT=$?
          if [ "${DRIFT:-0}" != "0" ]; then
            echo "::error::schema.prisma does not match the migration chain."
            echo "The following SQL would be required to close the gap:"
            echo '--------------------------------------------------------'
            cat /tmp/drift.sql
            echo '--------------------------------------------------------'
            echo "Fix: npx prisma migrate dev --name <describe_the_change>"
            exit 1
          fi
          echo "✅ No drift: migration chain and schema.prisma agree."

      # ── CHECK 3 ──────────────────────────────────────────────────────
      # migrate status must report a clean history — no failed migrations,
      # no rolled-back tombstones.
      - name: prisma migrate status
        run: npx prisma migrate status --schema prisma/schema.prisma

      # ── CHECK 4 ──────────────────────────────────────────────────────
      # Idempotency. The catch-up migration also runs against production,
      # where every object it creates already exists. Re-applying it to an
      # already-complete database must succeed and change nothing — that
      # is the property which makes it a safe no-op there.
      - name: Catch-up migration is idempotent
        run: |
          before=$(psql "$DATABASE_URL" -tAc "SELECT (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public')||'/'||(SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public')||'/'||(SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public')")
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -f prisma/migrations/20260516120000_catchup_missing_objects/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -f prisma/migrations/20260817120000_integrity_constraints/migration.sql
          after=$(psql "$DATABASE_URL" -tAc "SELECT (SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public')||'/'||(SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public')||'/'||(SELECT COUNT(*) FROM pg_indexes WHERE schemaname='public')")
          echo "before=$before after=$after"
          if [ "$before" != "$after" ]; then
            echo "::error::Re-applying the catch-up migration changed the schema."
            echo "It must be a no-op on an already-migrated database, or it is not"
            echo "safe to run against production."
            exit 1
          fi
          echo "✅ Idempotent: $after unchanged."

      # ── CHECK 5 ──────────────────────────────────────────────────────
      # The integrity constraints must actually exist after the chain
      # runs. Prisma does not model CHECK constraints, so migrate diff
      # cannot see them — without this step, silently dropping one would
      # go unnoticed.
      - name: Integrity constraints present
        run: |
          n=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM pg_constraint c JOIN pg_class cl ON cl.oid=c.conrelid JOIN pg_namespace ns ON ns.oid=cl.relnamespace WHERE ns.nspname='public' AND c.contype='c' AND c.conname IN ('PurchaseBatch_remaining_non_negative','PurchaseBatch_remaining_within_quantity','PurchaseBatch_quantity_positive','PurchaseBatch_unitcost_non_negative','ProductionCostAllocation_quantity_positive','ProductionCostAllocation_totalcost_non_negative','SaleCostAllocation_quantity_positive','DailyProduction_status_valid','TenantSetting_posting_mode_valid','Tenant_slug_not_blank')" | tr -d ' ')
          echo "integrity constraints found: $n/10"
          if [ "$n" != "10" ]; then
            echo "::error::Expected 10 integrity constraints, found $n."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────
  #  2. Unit tests + typecheck.
  # ───────────────────────────────────────────────────────────────────
  tests:
    name: Tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck (API)
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Unit tests (API)
        run: npx jest --config apps/api/jest.config.js --ci

      - name: Unit tests (erp-ai-core)
        run: npx jest --config packages/erp-ai-core/jest.config.js --ci

  # ───────────────────────────────────────────────────────────────────
  #  3. FIFO concurrency proof — REAL PostgreSQL, two live transactions.
  #
  #  A mocked Prisma client cannot interleave transactions, so it cannot
  #  observe a lost update. This job runs the actual thing.
  #
  #  The harness self-validates: scenario A replays the OLD
  #  read-modify-write pattern and asserts that it DOES double-consume.
  #  If that control ever stops failing, the harness has stopped being
  #  able to detect the defect and the other scenarios mean nothing.
  # ───────────────────────────────────────────────────────────────────
  fifo-concurrency:
    name: FIFO concurrency (real PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fifotest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pg driver
        run: npm install --no-save --prefix /tmp/pgdeps pg

      - name: Concurrency proof
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/fifotest
          PG_MODULE_PREFIX: /tmp/pgdeps
        run: node apps/api/test/fifo-concurrency.int.js

  # ───────────────────────────────────────────────────────────────────
  #  4. Regression guards — cheap greps for defects already fixed once.
  # ───────────────────────────────────────────────────────────────────
  guards:
    name: Regression guards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The production container previously ran
      # `prisma db push --accept-data-loss` at startup, which can drop
      # columns holding live data and writes nothing to _prisma_migrations.
      # It was replaced with `prisma migrate deploy`. This stops it coming
      # back through a merge.
      - name: No destructive db push in runtime startup
        run: |
          if grep -rn --include=Dockerfile --include='*.yml' --include='*.yaml' \
               --include='*.json' --include='*.sh' \
               -- '--accept-data-loss' . \
             | grep -v '^\./\.github/' \
             | grep -v '^\s*#' \
             | grep -vE '^[^:]+:[0-9]+:\s*(#|//|--)' ; then
            echo "::error::'--accept-data-loss' found in a runtime/deploy file."
            echo "Production startup must use 'prisma migrate deploy'."
            exit 1
          fi
          echo "✅ No destructive db push in deploy configuration."

      # The JWT signing secret must never have an inline fallback. Both the
      # signer and the verifier resolve it through core/config/jwt-secret.ts,
      # which refuses to start in production without a real secret.
      - name: No hardcoded JWT secret fallback
        run: |
          # Comment lines are stripped first — core/config/jwt-secret.ts
          # documents the old pattern in its root-cause note, and that
          # prose must not trip the guard.
          if grep -rn --include='*.ts' 'process\.env\.JWT_SECRET[[:space:]]*||' apps/ \
             | grep -vE ':[0-9]+:[[:space:]]*(\*|//|/\*)' ; then
            echo "::error::Inline JWT_SECRET fallback found."
            echo "Use resolveJwtSecret() from core/config/jwt-secret.ts."
            exit 1
          fi
          echo "✅ No inline JWT secret fallback."

      # The seed must never plant demo stock over a live inventory. It is
      # gated on a virgin-inventory check; seed-safety.spec.ts enforces the
      # detail, this catches deletion of the guard itself.
      # The bag→KG factor must come from item configuration, never from a
      # literal. Exactly one named constant is allowed (LEGACY_BAG_KG, the
      # labelled fallback); a bare `* 25` or a local BAG_KG is the defect
      # this replaced and must not come back.
      - name: No hardcoded bag conversion
        run: |
          hits=$(grep -rn --include='*.ts' --include='*.tsx' \
                   -E '(const +BAG_KG *=|\* *25\b)' apps/ \
                 | grep -v 'LEGACY_BAG_KG' \
                 | grep -vE ':[0-9]+: *(//|\*|/\*)' \
                 | grep -v '\.spec\.' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded bag conversion found:"
            echo "$hits"
            echo "Use resolveConversion() / Item.bagWeightKg instead."
            exit 1
          fi
          echo "✅ No hardcoded bag conversion."

      - name: Seed retains its production guard
        run: |
          if ! grep -q 'inventoryIsVirgin' prisma/seed.ts ; then
            echo "::error::prisma/seed.ts lost its inventoryIsVirgin guard."
            echo "Without it, deploying can overwrite live stock levels."
            exit 1
          fi
          echo "✅ Seed production guard present."
